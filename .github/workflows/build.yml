name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE out/win/
          Compress-Archive -Path out/win/* -DestinationPath DigDug-windows-x64.zip
      - name: Safety check - no ROMs in repository or package
        shell: bash
        run: |
          git ls-files > repo-files.txt
          bash packaging/check-no-roms.sh repo-files.txt
          unzip -Z1 DigDug-windows-x64.zip > zip-files.txt
          bash packaging/check-no-roms.sh zip-files.txt
      - name: Clean-machine test - the packaged exe must NOT find any ROM
        shell: pwsh
        run: |
          Expand-Archive DigDug-windows-x64.zip -DestinationPath pkgtest
          $p = Start-Process pkgtest/DigDug.exe -ArgumentList '--rom-status' -WorkingDirectory pkgtest -Wait -PassThru -RedirectStandardOutput status.txt
          Get-Content status.txt
          if ($p.ExitCode -ne 3) { throw "Packaged exe found a ROM set on a clean machine (exit code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: DigDug-windows-x64
          path: DigDug-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install SDL2 runtime
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 wget
      - name: Build AppImage
        run: bash ./packaging/linux/build-appimage.sh
      - name: Safety check - no ROMs in repository or AppImage
        run: |
          git ls-files > repo-files.txt
          bash packaging/check-no-roms.sh repo-files.txt
          cd out && ./DigDug-x86_64.AppImage --appimage-extract > /dev/null && find squashfs-root -type f > ../appimage-files.txt && cd ..
          bash packaging/check-no-roms.sh appimage-files.txt
      - name: Clean-machine test - the AppImage must NOT find any ROM
        run: |
          set +e
          ./out/DigDug-x86_64.AppImage --appimage-extract-and-run --rom-status
          code=$?
          echo "exit code: $code"
          test "$code" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: DigDug-linux-x86_64
          path: out/DigDug-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Dig Dug native port ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Native Windows and Linux builds of the Dig Dug arcade game. **You need your own Dig Dug ROM set** (MAME `digdug`) – none is included, and the build fails if any ROM-like file is found in a package.
            AI disclosure: this project was created with AI. It may contain errors.

            - **Windows (64-bit):** download `DigDug-windows-x64.zip`, extract, put your ROMs in a `roms` folder next to `DigDug.exe` (or pick `digdug.zip` when asked), run `DigDug.exe`.
            - **Linux (x86-64):** download `DigDug-x86_64.AppImage`, `chmod +x` it, put `digdug.zip` beside it (or pick it when asked), run it.

            See the [README](https://github.com/${{ github.repository }}#readme) for controls, options and troubleshooting.
          files: |
            dist/DigDug-windows-x64/DigDug-windows-x64.zip
            dist/DigDug-linux-x86_64/DigDug-x86_64.AppImage
